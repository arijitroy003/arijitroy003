      <circle cx="872" cy="82" r="4"/>
      <circle cx="952" cy="128" r="5"/>
      <circle cx="890" cy="112" r="4"/>
      <circle cx="1038" cy="214" r="5"/>
      <circle cx="1072" cy="254" r="4"/>
    </g>
