<svg 
  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Arijit Kumar Roy &#8212; Data and AI systems built for production</title>
  <desc id="description">Profile banner for a senior software engineer specializing in agentic AI, data platforms, and platform engineering at Red Hat.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#5b8cff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#55d6ff" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#9fc7ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="460" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#background)"/>
    <rect x="690" width="510" height="320" fill="url(#grid)"/>
    <circle cx="1080" cy="42" r="220" fill="#1e5fc7" opacity="0.08"/>
    <circle cx="1130" cy="38" r="128" fill="#23b7d9" opacity="0.05"/>
    <g fill="none" stroke="url(#signal)" stroke-width="1.5">
      <path d="M720 76 C818 76 822 44 900 44 S1016 88 1172 88"/>
      <path d="M710 108 C800 108 812 82 872 82 S952 128 1040 128 1108 110 1172 110"/>
      <path d="M740 142 C818 142 820 112 890 112 S972 174 1068 174 1118 148 1172 148"/>
      <path d="M700 188 C804 188 806 160 870 160 S956 214 1038 214 1116 190 1172 190"/>
      <path d="M734 232 C808 232 832 202 900 202 S988 254 1072 254 1124 232 1172 232"/>
    </g>
    <g fill="#07111f" stroke="#55d6ff" stroke-width="1.5">
