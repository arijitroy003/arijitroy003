      <rect x="1033" y="122" width="15" height="15" rx="3" fill="#55d6ff"/>
      <rect x="1060" y="166" width="16" height="16" rx="3" fill="#5b8cff"/>
      <rect x="1120" y="225" width="13" height="13" rx="2" fill="#55d6ff"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="458.5" rx="23.25" fill="none" stroke="#27405f" stroke-width="1.5"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="48" y="54" fill="#55d6ff" font-size="15" font-weight="700" letter-spacing="2.6">ARIJIT KUMAR ROY  /  BENGALURU, INDIA</text>
    <text x="48" y="121" fill="#f8fafc" font-size="50" font-weight="750" letter-spacing="-1.6">Data &amp; AI systems.</text>
    <text x="48" y="177" fill="#f8fafc" font-size="50" font-weight="750" letter-spacing="-1.6">Built for production.</text>
    <text x="50" y="220" fill="#b8c9dc" font-size="20" font-weight="450">Senior Software Engineer &#183; Platform Engineering at Red Hat</text>
    <text x="50" y="258" fill="#829ab4" font-size="15" font-weight="650" letter-spacing="1.35">AGENTIC AI  &#183;  DATA PLATFORMS  &#183;  CLOUD-NATIVE SYSTEMS</text>
    <g transform="translate(938 276)">
      <rect width="214" height="34" rx="17" fill="#0d2238" stroke="#2f5375"/>
      <circle cx="20" cy="17" r="4" fill="#55d6ff"/>
      <text x="34" y="22" fill="#cfe9ff" font-size="13" font-weight="700" letter-spacing="1">UPSTREAM CONTRIBUTOR</text>
    </g>
    <g>
      <rect x="32" y="324" width="269" height="108" rx="14" fill="#0b1a2b" stroke="#213b58"/>
      <text x="54" y="362" fill="#55d6ff" font-size="26" font-weight="750">38 &#8594; 4 min</text>
      <text x="54" y="389" fill="#d8e5f2" font-size="15" font-weight="600">Initial investigation</text>
      <text x="54" y="412" fill="#7f98b3" font-size="13">with a production reliability agent</text>
      <rect x="321" y="324" width="269" height="108" rx="14" fill="#0b1a2b" stroke="#213b58"/>
      <text x="343" y="362" fill="#55d6ff" font-size="26" font-weight="750">1,000+ hrs</text>
      <text x="343" y="389" fill="#d8e5f2" font-size="15" font-weight="600">Lead-engineer time saved</text>
      <text x="343" y="412" fill="#7f98b3" font-size="13">every year through orchestration</text>
      <rect x="610" y="324" width="269" height="108" rx="14" fill="#0b1a2b" stroke="#213b58"/>
      <text x="632" y="362" fill="#55d6ff" font-size="26" font-weight="750">$200K+ / yr</text>
      <text x="632" y="389" fill="#d8e5f2" font-size="15" font-weight="600">Infrastructure savings</text>
      <text x="632" y="412" fill="#7f98b3" font-size="13">from modernizing the data mesh</text>
      <rect x="899" y="324" width="269" height="108" rx="14" fill="#0b1a2b" stroke="#213b58"/>
      <text x="921" y="362" fill="#55d6ff" font-size="26" font-weight="750">100+ products</text>
      <text x="921" y="389" fill="#d8e5f2" font-size="15" font-weight="600">Enabled at enterprise scale</text>
      <text x="921" y="412" fill="#7f98b3" font-size="13">with governance built into delivery</text>
